name: fraud_warehouse
version: 1.0.0
config-version: 2

profile: fraud_warehouse

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

models:
  fraud_warehouse:
    +persist_docs:
      relation: true
      columns: true

    staging:
      +materialized: view

    dimensions:
      +materialized: table

    facts:
      +materialized: table

    marts:
      +materialized: table

vars:
  raw_dataset: fraud_analytics